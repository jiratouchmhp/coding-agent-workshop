[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "gemini-coding-agent-solution"
version = "0.1.0"
description = "Enterprise Coding Agent workshop reference solution built on Google ADK and Gemini Enterprise Agent Platform."
requires-python = ">=3.11"
dependencies = [
    # ADK Python 2.0+ unlocks collaborative subagent modes, declarative graph workflows,
    # dynamic workflows, and service registration (extras required for EnvironmentToolset,
    # GCPSkillRegistry, AgentRegistry, Auth Manager MCP, and GEPA eval/optimize).
    "google-adk[a2a,agent-identity,mcp,eval]>=2.0.0",
    # Gemini 4 SDK floor for automatic continuation_token long decodes (up to 1M unified tokens).
    "google-genai>=2.34.0",
    # Standalone Gemini Enterprise Agent Platform SDK (`agentplatform.Client` + ADK/eval integrations).
    "google-cloud-agentplatform[adk,evaluation]>=2.0.1",
    # Vertex AI / Agent Platform SDK (agent_engines and evaluation integrations).
    "google-cloud-aiplatform[agent_engines,evaluation]>=1.154.0",
    # Runtime observability (Lab 3 & Lab 6).
    "google-cloud-logging>=3.11.0",
    "google-cloud-monitoring>=2.22.0",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    # HTTP, schemas, YAML configs, and Agent Runtime HTTP server (Lab 4 & Lab 5).
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.2",
    "typing-extensions>=4.12.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
# Included in core `dependencies` above; kept as a backwards-compatible extra alias.
agentplatform = [
    "google-cloud-agentplatform[adk,evaluation]>=2.0.1",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[project.scripts]
sandbox-lifecycle = "coding_agent.tools.sandbox_lifecycle:main"
sandbox-execution = "coding_agent.tools.sandbox_execution:main"
agy-harness = "coding_agent.tools.agy_headless_harness:main"

[tool.hatch.build.targets.wheel]
packages = ["coding_agent"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["coding_agent", "eval"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
